        recurrence_set:
          type: string
          description: RRULE string (e.g. RRULE:FREQ=WEEKLY;INTERVAL=1;BYDAY=SA)
        recurring_until:
          type: string
          format: date
          description: End date for recurring chores (YYYY-MM-DD)

    UpdateChoreRequest:
      type: object
      properties:
        summary:
          type: string
        emoji_icon:
          type: string
        reward_points:
          type: integer
        start:
          type: string
          format: date
        recurrence_set:
          type: string
          nullable: true
        category_id:
          type: string
        routine:
          type: boolean
        up_for_grabs:
          type: boolean

    CompleteChoreRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [complete]

    MealRecipeAttributes:
      type: object
      properties:
        summary:
          type: string
        description:
          type: string
          nullable: true

    CreateMealRecipeRequest:
      type: object
      required: [meal_category_id, summary]
      properties:
        meal_category_id:
          type: string
        summary:
          type: string
        description:
          type: string
          nullable: true

    CreateMealSittingRequest:
      type: object
      required: [meal_category_id, date]
