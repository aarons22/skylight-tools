openapi: 3.0.3
info:
  title: Skylight Calendar API
  description: |
    Unofficial reverse-engineered API for the Skylight Calendar device.

    ## Authentication

    Full OAuth 2.0 Authorization Code flow:

    1. `GET /auth/session/new` — fetch the login page; extract the CSRF token from
       `<meta name="csrf-token" content="...">`.
    2. `POST /auth/session` — submit credentials (form-encoded) with the CSRF token.
       Server responds 302 → `/auth/session/success`; the authorization code is
       issued as part of the resulting session.
    3. `POST /oauth/token` — exchange the authorization code for a Bearer token.
    4. All API calls use `Authorization: Bearer <access_token>`.

    Tokens expire in 7200 seconds. Use the `refresh_token` with
    `grant_type=refresh_token` at `POST /oauth/token` to renew without re-logging in.

    > Note: `api.ourskylight.com` does not resolve. `app.ourskylight.com` is the sole active host.
  version: 1.0.0

servers:
  - url: https://app.ourskylight.com
    description: Skylight API server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        OAuth 2.0 Bearer token obtained from `POST /oauth/token`.
        Required companion header: `User-Agent: SkylightMobile (web)`

  schemas:
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime in seconds (7200)
        refresh_token:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          description: Unix timestamp

    JsonApiAttributes:
      type: object
      additionalProperties: true

    JsonApiResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/JsonApiAttributes'
        relationships:
          type: object
          additionalProperties: true

    JsonApiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiResource'
        meta:
          type: object
          additionalProperties: true

    JsonApiSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/JsonApiResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiResource'

    UserAttributes:
      type: object
      properties:
        subscription_status:
          type: string
        trial_days_remaining:
          type: integer
          nullable: true
        profile:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            birthday:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        agreed_to_marketing:
          type: boolean
        phone:
          type: string
          nullable: true
        trial_expires_at:
          type: string
          format: date-time
          nullable: true
        notification_preference:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        plus_billing_provider:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        was_plus_purchaser:
          type: boolean
        dunning_since:
          type: string
          nullable: true
        dunning_since_date:
          type: string
          nullable: true
        email:
          type: string

    FrameAttributes:
      type: object
      properties:
        name:
          type: string
        open_to_public:
          type: boolean
        message_viewability:
          type: string
        apps:
          type: array
          items:
