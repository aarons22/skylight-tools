    DeviceAttributes:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        activated:
          type: boolean
        category_id:
          type: string
          nullable: true
        role:
          type: string
        brightness:
          type: integer
        slideshow_speed:
          type: integer
        slideshow_style:
          type: integer
        start_sound:
          type: boolean
        show_caption:
          type: boolean
        show_heart:
          type: boolean
        blur_effect:
          type: boolean
        current_album_id:
          type: integer
        sleeps_at:
