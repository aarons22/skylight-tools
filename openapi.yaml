          type: string
          nullable: true
        meal_category_id:
          type: string
        add_to_grocery_list:
          type: boolean
          default: false
        date:
          type: string
          format: date
          description: Date of the sitting (YYYY-MM-DD)
        note:
          type: string
          nullable: true
        rrule:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    RewardPoint:
      type: object
      properties:
        category_id:
          type: string
        lifetime_points_earned:
          type: integer
        current_point_balance:
          type: integer

security:
  - BearerAuth: []

paths:
  /auth/session/new:
    get:
      summary: Fetch the login page and CSRF token
      security: []
      operationId: getLoginPage
      description: |
        Returns the HTML login page. Extract the CSRF token from the
        `<meta name="csrf-token" content="...">` tag and pass it as
        `authenticity_token` in the subsequent `POST /auth/session`.
      responses:
        '200':
          description: HTML login page containing CSRF token

  /auth/session:
    post:
      summary: Submit login credentials to start an OAuth session
      security: []
      operationId: createSession
      description: |
        Authenticates the user with email and password. On success, the server
        issues a 302 redirect to `/auth/session/success` and creates a session
        from which the web app obtains an authorization code to exchange at
        `POST /oauth/token`.

        The `authenticity_token` (CSRF token) must be fetched first from
        `GET /auth/session/new`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [authenticity_token, email, password]
              properties:
                authenticity_token:
                  type: string
                  description: CSRF token from GET /auth/session/new (88-char base64url string)
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '302':
          description: Redirect to /auth/session/success on successful login
          headers:
            Location:
              schema:
                type: string
              description: Redirect target (/auth/session/success)
        '422':
          description: Invalid credentials or CSRF token

  /oauth/token:
    post:
      summary: Exchange authorization code for Bearer token
      security: []
      operationId: oauthToken
      description: |
        OAuth 2.0 token endpoint. Supports `authorization_code` and `refresh_token` grant types.

        **Authorization Code flow** (initial login):
        After the user authenticates at `POST /auth/session`, the app obtains an authorization
        code and exchanges it here for a Bearer token.

        **Refresh Token flow** (renew expired token):
        Post `grant_type=refresh_token&refresh_token=<token>&client_id=skylight-mobile`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                  enum: [skylight-mobile]
                code:
                  type: string
                  description: Authorization code (required for authorization_code grant)
                refresh_token:
                  type: string
                  description: Refresh token (required for refresh_token grant)
                redirect_uri:
                  type: string
                  description: Must match the URI used to obtain the code
                scope:
                  type: string
                  default: everything
                skylight_api_client_device_fingerprint:
                  type: string
                  description: UUID identifying this client device
                skylight_api_client_device_platform:
                  type: string
                  example: web
                skylight_api_client_device_name:
                  type: string
                skylight_api_client_device_os_version:
                  type: string
                skylight_api_client_device_app_version:
                  type: string
                skylight_api_client_device_hardware:
                  type: string
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid grant or unsupported grant type

  /api/user:
    get:
      summary: Get the authenticated user's profile
      operationId: getUser
      responses:
        '200':
          description: User profile (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiSingleResponse'

  /api/plus_access:
    get:
      summary: Get the authenticated user's Plus subscription access
      operationId: getPlusAccess
      responses:
        '200':
          description: Plus access details (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiSingleResponse'

  /api/frames:
    get:
      summary: List all frames the user has access to
      operationId: listFrames
      responses:
        '200':
          description: All frames (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/calendar:
    get:
      summary: List calendar-type frames
      operationId: listCalendarFrames
      responses:
        '200':
          description: Calendar frames (JSON:API, type=approved_viewer_frame)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/photo:
    get:
      summary: List photo-type frames
      operationId: listPhotoFrames
      responses:
        '200':
          description: Photo frames (JSON:API, type=approved_viewer_frame)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/tv:
    get:
      summary: List TV-type frames
      operationId: listTvFrames
      responses:
        '200':
          description: TV frames (JSON:API, type=approved_viewer_frame)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}:
    get:
      summary: Get a single frame
      operationId: getFrame
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Frame (JSON:API, type=approved_viewer_frame)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiSingleResponse'

  /api/frames/{frameId}/devices:
    get:
      summary: List physical devices attached to a frame
      operationId: listDevices
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Devices (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/source_calendars:
    get:
      summary: List calendar sources connected to a frame
      operationId: listSourceCalendars
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source calendars (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/calendar_events:
    get:
      summary: List calendar events for a frame in a date range
      operationId: listCalendarEvents
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
        - name: date_min
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: date_max
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: timezone
          in: query
          schema:
            type: string
          description: IANA timezone name (e.g. America/New_York)
        - name: include
          in: query
          schema:
            type: string
          description: Comma-separated related resources to sideload
      responses:
        '200':
          description: Calendar events (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/categories:
    get:
      summary: List family member profile categories
      operationId: listCategories
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Categories (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/rewards:
    get:
      summary: List reward catalog items for a frame
      operationId: listRewards
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rewards (JSON:API, type=reward)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/reward_points:
    get:
      summary: Get reward point balances per category
      operationId: getRewardPoints
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reward points (plain array, not JSON:API)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardPoint'

  /api/frames/{frameId}/lists:
    get:
      summary: List all grocery/shopping lists for a frame
      operationId: listLists
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lists (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'

  /api/frames/{frameId}/lists/{listId}/list_items:
    get:
      summary: List all items in a list
      operationId: listItems
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
        - name: listId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List items (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'
    post:
      summary: Create a new list item
      operationId: createListItem
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
        - name: listId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListItemRequest'
      responses:
        '201':
          description: Created list item (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiSingleResponse'

  /api/frames/{frameId}/lists/{listId}/list_items/{itemId}:
    patch:
      summary: Update a list item
      operationId: updateListItem
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
        - name: listId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListItemRequest'
      responses:
        '200':
          description: Updated list item (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiSingleResponse'

  /api/frames/{frameId}/lists/{listId}/list_items/bulk_destroy:
    delete:
      summary: Bulk delete list items (only working deletion method)
      operationId: deleteListItems
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
        - name: listId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDestroyRequest'
      responses:
        '200':
          description: Items deleted successfully

  /api/frames/{frameId}/task_box/items:
    get:
      summary: List task box items
      operationId: listTaskBoxItems
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task box items (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiListResponse'
    post:
      summary: Create a task box item
      operationId: createTaskBoxItem
      parameters:
        - name: frameId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskBoxItemRequest'
      responses:
        '201':
          description: Created task box item (JSON:API)
