        destroyed_at:
          type: string
          format: date-time
          nullable: true
        household_name:
          type: string
          nullable: true
        brightness:
          type: integer
        slideshow_speed:
          type: integer
        slideshow_style:
          type: integer
        sleeps_at:
          type: string
          description: Time string (HH:MM)
        wakes_at:
          type: string
          description: Time string (HH:MM)
        currently_sleeping:
          type: boolean
        sleep_mode_on:
          type: boolean
        start_sound:
          type: boolean
        show_caption:
          type: boolean
        show_heart:
          type: boolean
        blur_effect:
          type: boolean
        current_album_id:
          type: integer
        side_by_side:
          type: boolean
        notification_email:
          type: string
          nullable: true
        gift_status:
          type: string
        mine:
          type: boolean
        plus:
          type: boolean
        trialing:
          type: boolean
        trial_expires_at:
          type: string
          format: date-time
          nullable: true
        user_created_at:
          type: string
          format: date-time
        access:
          type: string
        feature_bundle:
          type: object
